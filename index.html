<!DOCTYPE html>

  <script>
    const savedTheme = localStorage.getItem('theme-preference');
    const isDarkMode = savedTheme === 'dark' || 
                       (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    
    if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark-mode');
    } else if (savedTheme === 'system') {
      document.documentElement.classList.add('system-mode');
    }
    
    // Set theme-color for Safari status bar
    const themeColor = isDarkMode ? '#000000' : '#F9F9F9';
    const metaThemeColor = document.createElement('meta');
    metaThemeColor.name = 'theme-color';
    metaThemeColor.id = 'theme-color-meta';
    metaThemeColor.content = themeColor;
    document.head.appendChild(metaThemeColor);

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      const currentTheme = localStorage.getItem('theme-preference');
      if (currentTheme === 'system') {
        const meta = document.getElementById('theme-color-meta');
        if (meta) meta.content = e.matches ? '#000000' : '#F9F9F9';
      }
    });

    // Global function for Flutter to update theme-color
    window.updateThemeColor = function(isDark) {
      const meta = document.getElementById('theme-color-meta');
      if (meta) meta.content = isDark ? '#000000' : '#F9F9F9';
    };
  </script>
